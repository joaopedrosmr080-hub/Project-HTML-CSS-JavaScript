<!DOCTYPE html>
<html>
  <head>
    <title> Teste mobile </title>
    <style>
      
      /* modo claro*/
      @import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500&display=swap');
      div.border {
        padding: 20px;
        margin-top: 100px;
        margin-right: 100px;
        margin-left: 100px;
        border: 1px solid #cccccc;
        border-radius: 30px;
        background-color: #ecdbb6;
        text-align: left;
        color: #6e1822;
        animation: animation 0.3s ease-out;
        opacity: 0;
        visibility: hidden;
      }
      @keyframes animation {
         from {
          opacity: 0;
          transform: TranslateY(150px);
         }
          to {
            opacity: 1;
            transform: translateY(0px);
          }
      }
      body {
        background-color: #6e1822;
      }
      h1 {
        
       
        margin-right: 100px;
        margin-left: 100px;
        background-color: #ec0000;
        font-family: 'Playfair display', serif;
        text-align: center;
        text-decoration-line: underline;
        font-size: 26px;
        padding-bottom: 25px;
      }
      input[type="text"] {
        padding-bottom: 0px;
        margin-left: 8px;
        padding-top: 0px;
        width: 300px;
        height: 35px;
        border: 1px solid #525252;
        border-radius: 10px;
        background-color:#e9e9e3;
        accent-color: #ccc;
        color: #2c2c2c;
        font-family: 'Poppins';
      }
      input[type="email"] {
        padding-bottom: 0px;
        margin-left: 8px;
        padding-top: 0px;
        width: 300px;
        height: 35px;
        border: 1px solid #525252;
        border-radius: 10px;
        background-color:#e9e9e3;
        accent-color: #ccc;
        color: #2c2c2c;
        font-family: 'Poppins';
      }
      button {
        display: block;
        margin: 0 auto;
        height: 30px;
        width: 70px;
        background-color: #e9e9e3;
        border: 1px solid #525252;
        border-radius: 10px;
        color: #6e1822;
        font-family: 'poppins';
      }
      input[type="password"] {
        margin-bottom: 0px;
        margin-left: 8px;
        margin-top: 0px;
        width: 300px;
        height: 35px;
        border: 1px solid #525252;
        border-radius: 10px;
        background-color:#e9e9e3;
        color: #2c2c2c;
        font-family: Poppins;
      }
      p {
        margin-left: 8px;
        font-family: 'lora' ;
      }
      
      input:focus{
        outline: none;
        border: 2px solid #4285f4;
        box-shadow: 0 0 5px #4285f4;
      }
      span {
        position: relative;
        top: -3px;
      }
      /* modo oscuro */
      body.dark {
        background-color: #263A49;
        color: white;
      }
      body.dark h1 {
        color: white;
      }
      body.dark p {
        color: #ffffff;
      }
      body.dark div.border {
        background-color: #8FAFAD;
      
        
      }
      body.dark input {
        padding-bottom: 0px;
        margin-left: 8px;
        padding-top: 0px;
        width: 300px;
        height: 35px;
        border: 1px solid #525252;
        border-radius: 10px;
        background-color:#e9e9e3;
        accent-color: #ccc;
        color: #2c2c2c;
        font-family: 'Poppins';
      }
      body.dark button {
        display: block;
        margin: 0 auto;
        height: 30px;
        width: 70px;
        background-color: #e9e9e3;
        border: 1px solid #525252;
        border-radius: 10px;
        color: #263a49;
        font-family: 'poppins';
      }
      /* spin */
      .spin {
        margin-top: 5px;
        background-color: rgb(0,0,0,0);
        width: 50px;
        height: 50px;
        border: 5px solid rgb(192,192,192,1);
        border-radius: 50%;
        border-top: 5px solid rgb(192,192,192,0.3);
        animation: spin 1s linear infinite;
        
      }
      @keyframes spin {
        from {
          transform: rorate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      #loading {
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #loading.ocultar {
        opacity: 0;
        pointer-events: none;
      }
      div.border.mostrar{
        visibility: visible;
        animation: subirLogin 0.3s ease-out forwards;
      }
      @keyframes subirLogin {
        from {
          transform: translateY(50px);
          opacity: 0;
        }
        to {
          transform: translateY(0px);
          opacity: 1;
        }
      }
      /* boton */
      .switch {
        top: -5px;
        left: 10px;
        border: 1px hidden white;
        border-radius: 50px;
        display: inline-block;
        width: 60px;
        height: 30px;
        background-color: #6a1616;
        position: relative;
        cursor: pointer;
        transition: 0.3s;
      }
      .switch::after {
        content: "";
        width: 24px;
        height: 24px;
        background-color: #ecdbb6;
        border-radius: 50%;
        position: absolute;
        top: 3px;
        left: 3px;
        transition: 0.3s;
        
      }
      .mode {
        display: none;
      }
      input:checked + .switch {
        background-color: #263A49;
      }
      input:checked + .switch::after{
        transform: translateX(30px);
        background-color: #8FAFAD;
        
        
      }
    </style>
    
  </head>
  <body>
   <center>
    <div class="border" id="Login">
      
      <h1> Login </h1>
      <p> Email </p>
      <input type="email" id="email" class="input" placeholder="example@gmail.com" oninput="mostrarCampos()"/><br>
         <div id="campo" style="display:none;">
            <p> <input type="text" class="input" id="name" placeholder="name"/> </p>
            <p> <input type="text" class="input" id="2name" placeholder="last name" /> </p>
         </div>
      <p> password </p>
      <input type="password" placeholder="digite sua senha"/><br>
      <br><br>
      <p> <button value="enter" onclick="mostrar()">enter</button></p>
       <input type="checkbox" class="mode" id="toggle"/>
      <label for="toggle" class="switch"></label>
    </div>
     <div id="loading">
     <div class=spin></div>
 </div>  
   </center>
    <script>
      const boton=
        document.getElementById("toggle");
      boton.addEventListener("change",
      function() {
        document.body.classList.toggle("dark", boton.checked);
      }
      );
      function mostrar() {
        var name= document.getElementById("name").value;
        var last= document.getElementById("2name").value;
        alert("hello," + " " + name + " " + last);
      }
      function mostrarCampos() {
        var email= document.getElementById("email").value;
          if(email.includes("@")) {
            document.getElementById("campo").style.display = "block";
          }
      
      else {
        document.getElementById("campo").style.display = "none";
      }
      }
      window.addEventListener("load", function() {

    setTimeout(function() {

        let loading = document.getElementById("loading");
        let login = document.querySelector("div.border");

        loading.classList.add("ocultar");
        login.classList.add("mostrar");

        setTimeout(function() {
            loading.style.display = "none";
        }, 300);

    }, 1000);

});
    </script>
  </body>
</html>
